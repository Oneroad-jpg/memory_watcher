name: MemoryWatcherWatch
options:
  bundleIdPrefix: com.oneroad.memorywatcher
  deploymentTarget:
    watchOS: "10.0"
packages:
  MemoryWatcher:
    path: ..
targets:
  MemoryWatcherWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/MemoryWatcherWatchApp
    dependencies:
      - package: MemoryWatcher
        product: MemoryWatcherShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oneroad.memorywatcher.watch
        MARKETING_VERSION: 0.4.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  MemoryWatcherWatch:
    build:
      targets:
        MemoryWatcherWatch: all
    run:
      config: Debug
    archive:
      config: Release
